<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller 2 DevOps — Calculadora Distribuida (HU1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-globes">
    <div class="globe globe-1"></div>
    <div class="globe globe-2"></div>
  </div>

  <div class="app-container">
    <!-- Header principal con branding y badge de estado -->
    <header class="main-header">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>Taller 2 DevOps</h1>
          <p class="subtitle">Simulación de Despliegue — Servicio de Suma (HU1)</p>
        </div>
      </div>
      <div class="status-badge-container">
        <div id="connectionStatus" class="status-badge offline">
          <span class="pulse-dot"></span>
          <span id="statusText">Conectando...</span>
        </div>
      </div>
    </header>

    <!-- Layout Grid Principal -->
    <main class="grid-layout">
      <!-- Tarjeta 1: Calculadora de Suma (HU1) -->
      <section class="card calculator-card">
        <div class="card-header">
          <h3>🧮 Calculadora Distribuida Tetra</h3>
          <span class="badge-tag">HU1: SUMA REST API</span>
        </div>

        <div class="input-group-grid">
          <div class="input-field">
            <label for="inputA">Número A</label>
            <input type="number" id="inputA" step="any" placeholder="Ej: 10" value="10">
          </div>
          <div class="input-field">
            <label for="inputB">Número B</label>
            <input type="number" id="inputB" step="any" placeholder="Ej: 5" value="5">
          </div>
        </div>

        <div class="operations-grid">
          <button class="btn op-btn" data-op="sum">
            <span class="op-symbol">+</span> Sumar (HU1)
          </button>
        </div>

        <div class="result-box">
          <span class="result-label">Resultado de Operación</span>
          <div id="resultDisplay" class="result-value">--</div>
          <div id="resultOperation" class="result-subtext">Esperando interacción del usuario</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <p>Universidad ICESI &bull; Ingeniería de Software V &bull; Simulación DevOps</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
