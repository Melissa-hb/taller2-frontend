server {
    listen       80;
    server_name  _;

    # Raiz con los archivos estaticos de la SPA (montados desde ./public)
    root  /usr/share/nginx/html;
    index index.html;

    # Compresion basica para HTML/CSS/JS
    gzip            on;
    gzip_types      text/css application/javascript application/json;
    gzip_min_length 512;

    # ---- Archivos estaticos de la SPA ----
    # Si el recurso no existe, se devuelve index.html (comportamiento SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Endpoints dinamicos servidos por Express (contenedor "app") ----
    # app.js llama a /config para conocer la URL del backend
    location = /config {
        proxy_pass       http://app:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telemetria HU5: uptime del front + sondeo de salud del backend
    location = /status {
        proxy_pass       http://app:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
